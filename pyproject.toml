[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-prices-ceiling"
version = "0.1.0"
description = "Calcula preco teto com base em dividendos historicos do yfinance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "yfinance>=0.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
preco-teto = "stock_prices_ceiling.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
